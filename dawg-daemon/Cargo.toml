[package]
name = "dawg-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
dawg-core = { path = "../dawg-core" }
libc = "0.2.190"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.38.4"
tokio = { version = "1.53.3", features = ["full"] }
uuid = { version = "1.28.0", features = ["v4"] }
sha1 = "0.10"
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
axum = "0.8"
argon2 = "0.5"
cap-std = "4"
http-body-util = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
igd-next = { version = "0.18", default-features = false, features = ["aio_tokio"] }
tar = "0.4"
flate2 = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
