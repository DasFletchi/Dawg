[package]
name = "dawg-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2.190"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.38.4"
tokio = { version = "1.53.3", features = ["full"] }
uuid = { version = "1.28.0", features = ["v4"] }
