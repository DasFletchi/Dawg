
name: Build & Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake pkg-config libwayland-dev libxkbcommon-dev

      - name: Install Java for process integration tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace

      - name: Build workspace
        run: cargo build --locked --workspace --all-targets

      - name: Exercise daemon with a real Java process
        run: python3 scripts/smoke.py

      - name: Exercise authenticated HTTP administration and files
        run: python3 scripts/web_smoke.py

      - name: Verify isolated installation and full removal
        run: python3 scripts/test_uninstall.py --real-binary-dir target/debug

      - name: Build release binaries and AppImage
        run: |
          cargo build --locked --workspace --bins --release
          strip target/release/dawg-daemon target/release/dawg-ui

          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp target/release/dawg-daemon AppDir/usr/bin/
          cp target/release/dawg-ui AppDir/usr/bin/
          ln -s dawg-ui AppDir/usr/bin/dawg

          cp dawg.desktop AppDir/
          cp dawg.desktop AppDir/usr/share/applications/
          cp assets/dawg.png AppDir/
          cp assets/dawg.png AppDir/usr/share/icons/hicolor/256x256/apps/
          ln -s dawg.png AppDir/.DirIcon

          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/dawg" "$@"
          EOF
          chmod +x AppDir/AppRun

          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir Dawg-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Dawg-x86_64.AppImage
          path: Dawg-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake pkg-config libwayland-dev libxkbcommon-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --locked --workspace --bins --release

      - name: Package release binaries
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/stage

          found=0

          for binary in target/release/*; do
            if [[ -f "$binary" && -x "$binary" ]]; then
              cp "$binary" dist/stage/
              found=1
            fi
          done

          if [[ "$found" -eq 0 ]]; then
            echo "::error::No release binaries found"
            exit 1
          fi

          mkdir -p dist/stage/scripts
          cp scripts/install.py scripts/uninstall.py dist/stage/scripts/
          cp README.md dist/stage/

          archive="dawg-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"

          tar -czf "dist/${archive}" -C dist/stage .

          (
            cd dist
            sha256sum "$archive" > "${archive}.sha256"
          )

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
