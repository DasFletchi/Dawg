
name: Build & Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dawg-debug-linux-x86_64
          path: |
            target/debug/dawg-daemon
            target/debug/dawg-ui
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Create GitHub Release
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --workspace --bins --release

      - name: Package release binaries
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/stage

          found=0

          for binary in target/release/*; do
            if [[ -f "$binary" && -x "$binary" ]]; then
              cp "$binary" dist/stage/
              found=1
            fi
          done

          if [[ "$found" -eq 0 ]]; then
            echo "::error::No release binaries found"
            exit 1
          fi

          archive="dawg-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"

          tar -czf "dist/${archive}" -C dist/stage .

          (
            cd dist
            sha256sum "$archive" > "${archive}.sha256"
          )

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
